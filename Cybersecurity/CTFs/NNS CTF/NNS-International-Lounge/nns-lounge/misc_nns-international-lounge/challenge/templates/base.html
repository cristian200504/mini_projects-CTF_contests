<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}NNS International Lounge{% endblock %}</title>
  <link rel="preload" as="font" type="font/woff" href="/static/fonts/avinor-light.woff" crossorigin>
  <link rel="preload" as="font" type="font/woff" href="/static/fonts/avinor-medium.woff" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
