services:
  challenge:
    build: .
    ports:
      - "3000:3000"
    environment:
      FLAG: NNS{localhost}
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
