apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sites.triangle.io
spec:
  group: triangle.io
  scope: Namespaced
  names:
    kind: Site
    listKind: SiteList
    plural: sites
    singular: site
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - siteYAML
              properties:
                siteYAML:
                  type: string
                  maxLength: 8192
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
